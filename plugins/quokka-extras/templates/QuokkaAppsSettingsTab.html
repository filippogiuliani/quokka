<div class="form-horizontal quokka-apps-settings">
	<div class="legend" data-i18n="QUOKKA_EXTRAS/TAB_APPS"></div>
	<p class="quokka-intro" data-i18n="QUOKKA_EXTRAS/APPS_INTRO"></p>

	<!-- ko if: 'ok' === state() -->
	<p class="quokka-note" data-bind="text: hello"></p>
	<!-- ko if: families().length > 1 -->
	<div class="control-group">
		<label for="quokka-hub-family" data-i18n="QUOKKA_EXTRAS/FAMILY"></label>
		<select id="quokka-hub-family" data-bind="options: families, optionsText: 'name', optionsValue: 'id', value: family, disable: saving"></select>
	</div>
	<!-- /ko -->
	<ul class="quokka-apps-list">
		<li><b>Kooka</b> — <span data-bind="text: kooka() ? onText : offText"></span></li>
		<li><b>Pelican</b> — <span data-bind="text: pelican() ? onText : offText"></span></li>
	</ul>
	<p class="quokka-note" data-bind="visible: !kooka() || !pelican()" data-i18n="QUOKKA_EXTRAS/APPS_ACCESS_HOWTO"></p>
	<!-- /ko -->
	<!-- ko ifnot: 'ok' === state() || 'loading' === state() -->
	<p class="quokka-note" data-bind="text: stateText"></p>
	<!-- /ko -->
	<div class="quokka-save">
		<button class="btn" data-bind="click: refresh, enable: !saving()" data-i18n="QUOKKA_EXTRAS/APPS_REFRESH"></button>
		<span data-bind="text: message, css: {'quokka-error': error}"></span>
	</div>
</div>
