<div class="b-folders g-ui-user-select-none">
	<!-- Quokka: the app's name -->
	<div class="quokka-brand"><span class="quokka-wordmark" role="img" aria-label="Quokka"><svg viewBox="0 0 300 320" aria-hidden="true"><circle class="qf-fur" cx="70" cy="62" r="44" stroke-width="26"></circle><circle class="qf-fur" cx="230" cy="62" r="44" stroke-width="26"></circle><ellipse class="qf-fur" cx="150" cy="180" rx="122" ry="118" stroke-width="30"></ellipse><circle cx="108" cy="166" r="15" fill="#1e3a5f"></circle><circle cx="192" cy="166" r="15" fill="#1e3a5f"></circle><ellipse cx="150" cy="202" rx="20" ry="14" fill="#1e3a5f"></ellipse><path class="qf-smile" d="M120 232 Q150 258 180 232" stroke-width="16" stroke-linecap="round"></path></svg>quokka</span></div>
	<div class="b-toolbar btn-toolbar">
		<a class="btn buttonCompose" data-bind="click: composeClick, css: {'btn-warning': composeInEdit, 'btn-success': !composeInEdit()}" data-i18n="[title]FOLDER_LIST/BUTTON_NEW_MESSAGE">
			<i class="icon-paper-plane"></i>
			<span class="buttonComposeText" data-i18n="FOLDER_LIST/BUTTON_NEW_MESSAGE"></span>
		</a>
		<a class="btn buttonContacts fontastic" data-bind="visible: allowContacts, click: contactsClick" data-i18n="[title]GLOBAL/CONTACTS">📇</a>
	</div>
	<div class="b-content">
		<!-- Quokka: one mailbox: its folders as ever. More: "All mailboxes" first, then each mailbox with its folders (as Outlook) -->
		<!-- ko ifnot: hasMailboxes -->
		<!-- ko template: { name: 'QuokkaOwnSystem', data: $root } --><!-- /ko -->
		<!-- /ko -->
		<!-- ko if: hasMailboxes -->
		<div class="quokka-all-head"><span class="box-badge box-all" aria-hidden="true">∗</span><span class="box-name" data-bind="text: allMailboxesLabel"></span></div>
		<ul class="b-folders-system quokka-all-folders" data-bind="foreach: unifiedFolders">
			<li><a href="#" data-bind="click: $root.openUnified, css: {selected: selected}, attr: {'data-icon': icon, 'data-unread': unread || null}, text: label"></a></li>
		</ul>
		<!-- /ko -->
		<div class="b-categories-title" data-bind="visible: categories().length" data-i18n="QUOKKA/CATEGORIES"></div>
		<ul class="b-categories" data-bind="foreach: categories">
			<li>
				<a data-bind="attr: {href: href, 'data-category': key}, css: {selected: selected}">
					<span class="dot"></span><!-- ko text: label --><!-- /ko -->
				</a>
			</li>
		</ul>
		<!-- Quokka: Kooka's calendar, in a tab of its own -->
		<!-- ko if: calendarUrl -->
		<a class="quokka-calendar-link" target="_blank" rel="noopener" data-bind="attr: {href: calendarUrl}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg><span data-bind="text: calendarLabel"></span></a>
		<!-- /ko -->
		<!-- ko ifnot: hasMailboxes -->
		<hr>
		<!-- ko template: { name: 'QuokkaOwnFolders', data: $root } --><!-- /ko -->
		<!-- /ko -->
		<!-- ko if: hasMailboxes -->
		<!-- ko foreach: mailboxes -->
		<div class="quokka-box" data-bind="css: {'is-current': current, 'is-collapsed': collapsed, 'is-quiet': $root.allMailboxesSelected}">
			<a href="#" class="quokka-box-head" data-bind="click: $root.toggleBox, attr: {title: email, 'aria-expanded': collapsed() ? 'false' : 'true'}">
				<svg class="box-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
				<span class="box-badge" aria-hidden="true" data-bind="text: letter, style: {backgroundColor: color}"></span>
				<span class="box-name" data-bind="text: name"></span>
				<span class="box-unread" data-bind="text: collapsed() && unread() || ''"></span>
			</a>
			<!-- ko ifnot: collapsed -->
			<!-- ko if: current -->
			<!-- ko template: { name: 'QuokkaOwnSystem', data: $root } --><!-- /ko -->
			<!-- ko template: { name: 'QuokkaOwnFolders', data: $root } --><!-- /ko -->
			<!-- /ko -->
			<!-- ko ifnot: current -->
			<ul class="b-folders-system quokka-remote-folders" data-bind="foreach: folders">
				<li>
					<!-- ko if: selectable -->
					<a href="#" data-bind="click: () => $root.openBoxFolder($parent, $data), attr: {'data-icon': icon, 'data-unread': unread, title: name}, style: {marginLeft: indent}, text: label"></a>
					<!-- /ko -->
					<!-- ko ifnot: selectable -->
					<span class="quokka-folder-parent" data-bind="style: {marginLeft: indent}, text: label"></span>
					<!-- /ko -->
				</li>
			</ul>
			<!-- /ko -->
			<!-- /ko -->
		</div>
		<!-- /ko -->
		<!-- /ko -->
	</div>
	<!-- Quokka: who is signed in; settings -->
	<a class="quokka-account" data-bind="attr: {href: settingsHref, title: accountEmail}">
		<span class="quokka-avatar" data-bind="text: accountInitial"></span>
		<span class="quokka-account-email" data-bind="text: accountEmail"></span>
		<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
	</a>
	<div class="b-footer btn-toolbar">
		<div class="btn-group">
			<a class="btn fontastic toggleLeft" data-bind="click: toggleLeftPanel"></a>
		</div>
		<div class="btn-group hide-on-panel-disabled">
			<a class="btn icon-folder-add" data-bind="click: createFolder" data-i18n="[title]POPUPS_CREATE_FOLDER/TITLE_CREATE_FOLDER"></a>
			<a class="btn fontastic" data-bind="click: configureFolders" data-i18n="[title]SETTINGS_LABELS/FOLDERS">⚙</a>
		</div>
	</div>
</div>
