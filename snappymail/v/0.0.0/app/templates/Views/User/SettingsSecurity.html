<div class="form-horizontal quokka-cols">
	<div class="quokka-section">
		<div class="legend" data-i18n="QUOKKA/SEC_TITLE"></div>
		<div class="control-group">
			<label data-i18n="SETTINGS_SECURITY/LABEL_AUTOLOGOUT"></label>
			<div data-bind="component: {
				name: 'Select',
				params: {
					options: autoLogoutOptions,
					value: autoLogout,
					trigger: autoLogoutTrigger,
					optionsText: 'name',
					optionsValue: 'id'
				}
			}"></div>
		</div>
		<!-- Quokka: encryption only where it is turned on (QUOKKA_ENCRYPTION) -->
		<!-- ko if: canOpenPGP || canGnuPG -->
		<div class="control-group">
			<label data-i18n="SETTINGS_SECURITY/FORGET_KEY_PASS"></label>
			<div data-bind="component: {
				name: 'Select',
				params: {
					options: autoLogoutOptions,
					value: keyPassForget,
					trigger: keyPassForgetTrigger,
					optionsText: 'name',
					optionsValue: 'id'
				}
			}"></div>
		</div>
		<!-- /ko -->

	</div>
	<div class="quokka-section">
		<!-- Quokka: two-step verification, sign-ins, stolen passwords, privacy (plugins/quokka-security) -->
		<div class="legend" data-i18n="QUOKKA/TWO_STEP"></div>
		<p class="quokka-intro" data-i18n="QUOKKA/TWO_STEP_INTRO"></p>
		<!-- ko if: sec() && !sec().available -->
		<div class="control-group quokka-note" data-bind="i18nUpdate: true"><span data-i18n="QUOKKA/TWO_STEP_UNAVAILABLE"></span></div>
		<!-- /ko -->
		<!-- ko if: sec() && sec().available -->
			<!-- ko if: backupShown().length -->
			<div class="control-group quokka-backup" data-bind="i18nUpdate: true">
				<span data-i18n="[html]QUOKKA/BACKUP_CODES"></span>
				<ol data-bind="foreach: backupShown"><li data-bind="text: $data"></li></ol>
				<button class="btn btn-primary" data-bind="click: backupDone" data-i18n="QUOKKA/BACKUP_SAVED"></button>
			</div>
			<!-- /ko -->
			<!-- ko if: !backupShown().length && !sec().totp && !totpSetup() -->
			<div class="control-group" data-bind="i18nUpdate: true">
				<label data-i18n="QUOKKA/TWO_STEP_OFF"></label>
				<button class="btn btn-primary" data-bind="click: totpStart, enable: !secBusy()" data-i18n="QUOKKA/TURN_ON"></button>
			</div>
			<!-- /ko -->
			<!-- ko with: totpSetup -->
			<div class="control-group quokka-totp-setup" data-bind="i18nUpdate: true">
				<div class="quokka-qr" data-bind="html: qr"></div>
				<div class="quokka-totp-steps">
					<p data-i18n="[html]QUOKKA/TOTP_STEP1"></p>
					<code data-bind="text: secret"></code>
					<a class="quokka-open-app" data-bind="attr: {href: uri}" data-i18n="QUOKKA/TOTP_OPEN_IN_APP"></a>
					<p data-i18n="[html]QUOKKA/TOTP_STEP2"></p>
					<div class="quokka-code-row">
						<input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="123456" data-bind="textInput: $parent.totpCode">
						<button class="btn btn-primary" data-bind="click: () => $parent.totpConfirm(), enable: $parent.totpCodeReady" data-i18n="QUOKKA/CONFIRM"></button>
						<button class="btn" data-bind="click: () => $parent.totpCancel()" data-i18n="GLOBAL/CANCEL"></button>
					</div>
				</div>
			</div>
			<!-- /ko -->
			<!-- ko if: !backupShown().length && sec().totp -->
			<div class="control-group" data-bind="i18nUpdate: true">
				<label><span data-bind="text: totpSince"></span><small class="quokka-sub" data-bind="text: backupLeftText"></small></label>
				<div class="quokka-inline" data-bind="visible: !codeFor()">
					<button class="btn" data-bind="click: () => askCode('backup')" data-i18n="QUOKKA/NEW_BACKUP_CODES"></button>
					<button class="btn" data-bind="click: () => askCode('disable')" data-i18n="QUOKKA/TURN_OFF"></button>
				</div>
			</div>
			<div class="control-group" data-bind="i18nUpdate: true, visible: codeFor">
				<label data-bind="text: codeForText"></label>
				<div class="quokka-code-row">
					<input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="9" placeholder="123456" data-bind="textInput: totpCode">
					<button class="btn btn-primary" data-bind="click: codeConfirm, enable: totpCodeReady" data-i18n="QUOKKA/CONFIRM"></button>
					<button class="btn" data-bind="click: totpCancel" data-i18n="GLOBAL/CANCEL"></button>
				</div>
			</div>
			<!-- /ko -->
		<!-- /ko -->
		<div class="quokka-sec-message" data-bind="visible: secMessage, text: secMessage, css: {'quokka-error': secError}"></div>

	</div>
	<div class="quokka-section">
		<div class="legend" data-i18n="QUOKKA/LOGINS"></div>
		<p class="quokka-intro" data-i18n="QUOKKA/LOGINS_INTRO"></p>
		<div class="quokka-logins" data-bind="visible: logins().length, foreach: logins">
			<div class="quokka-login" data-bind="i18nUpdate: true, css: {wrong: !ok}">
				<div class="quokka-login-main">
					<span class="device" data-bind="text: device"></span>
					<span class="here" data-bind="visible: here" data-i18n="QUOKKA/THIS_DEVICE"></span>
				</div>
				<div class="quokka-login-sub" data-bind="text: when + ' · ' + where + ' · ' + how"></div>
			</div>
		</div>
		<div class="control-group quokka-note" data-bind="visible: sec() && !logins().length"><span data-i18n="QUOKKA/NO_LOGINS"></span></div>

	</div>
	<div class="quokka-section">
		<div class="legend" data-i18n="QUOKKA/STOLEN"></div>
		<div class="control-group">
			<div data-bind="component: {
				name: 'Checkbox',
				params: {
					label: 'QUOKKA/STOLEN_CHECK',
					value: pwnedCheck
				}
			}"></div>
			<div class="quokka-row-note"><span data-i18n="QUOKKA/STOLEN_HELP"></span></div>
		</div>
		<div class="control-group quokka-note" data-bind="visible: pwnedText, css: {'quokka-danger': sec() && sec().pwned && sec().pwned.count}"><span data-bind="text: pwnedText"></span></div>

	</div>
	<div class="quokka-section">
		<div class="legend" data-i18n="QUOKKA/PRIVACY"></div>
		<p class="quokka-intro" data-i18n="QUOKKA/PRIVACY_INTRO"></p>
		<div class="control-group">
			<label data-i18n="SETTINGS_GENERAL/EXTERNAL_IMAGES"></label>
			<div>
				<select data-bind="value: viewImages">
					<option value="ask" data-i18n="SETTINGS_GENERAL/IMAGES_OPTION_ASK"></option>
					<option value="match" data-i18n="SETTINGS_GENERAL/IMAGES_OPTION_WHITELIST"></option>
					<option value="always" data-i18n="SETTINGS_GENERAL/IMAGES_OPTION_ALWAYS"></option>
				</select>
			</div>
		</div>
		<div class="control-group" data-bind="visible: 'match' === viewImages()">
			<label data-i18n="SETTINGS_GENERAL/IMAGES_WHITELIST"></label>
			<div>
				<textarea data-bind="textInput: viewImagesWhitelist" data-i18n="[placeholder]QUOKKA/WHITELIST_PLACEHOLDER"></textarea>
			</div>
		</div>
	</div>
</div>

<!-- ko if: canOpenPGP || canGnuPG -->
<div class="legend">OpenPGP</div>
<button class="btn" data-bind="click: addOpenPgpKey" data-icon="✚" data-i18n="SETTINGS_OPENPGP/BUTTON_IMPORT_KEY"></button>
<!-- ko if: canOpenPGP || canGnuPG -->
&nbsp;&nbsp;
<button class="btn" data-bind="click: generateOpenPgpKey" data-icon="🔑" data-i18n="SETTINGS_OPENPGP/BUTTON_GENERATE_KEY_PAIR"></button>
<!-- /ko -->

<!-- ko if: canGnuPG -->
<details style="margin:1em 0">
<summary style="font-size:larger;font-weight:bold">GnuPG</summary>
<table class="table table-hover list-table">
	<tbody><tr><th colspan="4" data-i18n="SETTINGS_OPENPGP/TITLE_PRIVATE">Private keys</th></tr></tbody>
	<tbody data-bind="foreach: gnupgPrivateKeys, i18nUpdate: gnupgPrivateKeys">
		<tr>
			<td data-bind="click: view">
				<span data-bind="visible: can_sign" class="fontastic" data-i18n="[title]CRYPTO/SIGN">✍</span>
				<span data-bind="visible: can_decrypt" class="fontastic" data-i18n="[title]CRYPTO/DECRYPT">🔓</span>
				<span class="key-id" data-bind="text: id"></span>
				<!-- ko foreach: emails -->
				<span class="key-user" data-bind="text: $data"></span>
				<!-- /ko -->
			</td>
			<td>
				<a class="btn btn-small btn-danger button-confirm-delete" data-bind="css: {'delete-access': askDelete()}, click: remove"
					data-i18n="GLOBAL/ARE_YOU_SURE"></a>
			</td>
			<td>
				<span class="delete-key fontastic" data-bind="visible: !askDelete(), click: openForDeletion">🗑</span>
			</td>
		</tr>
		<tr data-bind="visible: hasStoredPass">
			<td>
				<span class="fontastic" data-i18n="[title]SETTINGS_OPENPGP/TITLE_PRIVATE">🔒</span>
				<span class="key-id" data-bind="text: id"></span>
				<span>🔑</span><span class="key-user" data-i18n="SETTINGS_SECURITY/LABEL_STORED_PASS"></span>
			</td>
			<td>
				<a class="btn btn-small btn-danger button-confirm-delete" data-bind="css: {'delete-access': askForgetPass()}, click: forgetPass"
					 data-i18n="GLOBAL/ARE_YOU_SURE"></a>
			</td>
			<td>
				<span class="delete-key fontastic" data-bind="visible: !askForgetPass(), click: openForPassForget">🗑</span>
			</td>
		</tr>
	</tbody>
	<tbody><tr><th colspan="4" data-i18n="SETTINGS_OPENPGP/TITLE_PUBLIC">Public keys</th></tr></tbody>
	<tbody data-bind="foreach: gnupgPublicKeys, i18nUpdate: gnupgPublicKeys">
		<tr>
			<td data-bind="click: view">
				<span data-bind="visible: can_verify" class="fontastic" data-i18n="[title]CRYPTO/VERIFY">✔</span>
				<span data-bind="visible: can_encrypt" class="fontastic" data-i18n="[title]CRYPTO/ENCRYPT">🔒</span>
				<span class="key-id" data-bind="text: id"></span>
				<!-- ko foreach: emails -->
				<span class="key-user" data-bind="text: $data"></span>
				<!-- /ko -->
			</td>
			<td>
				<a class="btn btn-small btn-danger button-confirm-delete" data-bind="css: {'delete-access': askDelete()}, click: remove"
					data-i18n="GLOBAL/ARE_YOU_SURE"></a>
			</td>
			<td>
				<span class="delete-key fontastic" data-bind="visible: !askDelete(), click: openForDeletion">🗑</span>
			</td>
		</tr>
	</tbody>
</table>
</details>
<!-- /ko -->

<details style="margin:1em 0">
<summary style="font-size:larger;font-weight:bold">Mailvelope</summary>
<a data-bind="visible: !canMailvelope" href="https://mailvelope.com/en/help" target="_blank" data-i18n="SETTINGS_OPENPGP/GET_MAILVELOPE"></a>
<div id="mailvelope-settings" style="height:40em" data-bind="visible: canMailvelope"></div>
</details>

<details>

	<tbody data-bind="foreach: smimeCertificates, i18nUpdate: smimeCertificates">
