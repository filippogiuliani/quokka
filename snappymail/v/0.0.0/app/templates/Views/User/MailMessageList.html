<div class="btn-toolbar" data-bind="css: {'hasChecked':checkAll}">
	<a class="btn btn-thin fontastic toggleLeft"></a>
	<a class="btn buttonCompose onCheckedHide" data-bind="click: composeClick, css: {'btn-warning': composeInEdit, 'btn-success': !composeInEdit()}" data-i18n="[title]FOLDER_LIST/BUTTON_NEW_MESSAGE">
		<i class="icon-paper-plane"></i>
	</a>
	<a class="btn onCheckedHide" data-bind="click: reload" data-i18n="[title]MESSAGE_LIST/BUTTON_RELOAD">
		<i class="icon-spinner not-animated"></i>
	</a>
	<a href="#" tabindex="-1" class="btn onCheckedShow" data-bind="command: moveCommand" data-i18n="[title]GLOBAL/MOVE_TO">
		<i class="icon-copy visible-on-ctrl-btn"></i>
		<i class="fontastic hidden-on-ctrl-btn">📁</i>
	</a>
	<div class="btn-group onCheckedShow">
		<a class="btn fontastic" data-bind="visible: archiveAllowed, command: archiveCommand" data-i18n="[title]GLOBAL/TO_ARCHIVE">🗄</a>
		<a class="btn fontastic" data-bind="visible: canMarkAsSpam, command: spamCommand" data-i18n="[title]GLOBAL/TO_SPAM">⚠</a>
		<a class="btn" data-bind="visible: isSpamFolder, command: notSpamCommand" data-i18n="[title]GLOBAL/NOT_SPAM">
			<i class="icon-check-mark-circle-two"></i>
		</a>
		<a class="btn fontastic" data-bind="command: deleteCommand" data-i18n="[title]GLOBAL/DELETE">🗑</a>
<!--
		<a class="btn fontastic" data-bind="command: undeleteCommand, hidden: hideDeleted" data-i18n="[title]GLOBAL/UNDELETE" style="transform:rotate(-180deg)">🗑</a>
-->
	</div>
	<div class="btn-group dropdown" data-bind="registerBootstrapDropdown: true">
		<a id="more-list-dropdown-id" class="btn dropdown-toggle fontastic" href="#" tabindex="-1" data-i18n="[title]GLOBAL/MORE">☰</a>
		<menu class="dropdown-menu" role="menu" aria-labelledby="more-list-dropdown-id">
			<li role="presentation" data-bind="click: listUnsetSeen, css: {'disabled': !messageList.hasCheckedOrSelected()}">
				<a href="#" tabindex="-1" data-icon="" data-i18n="MESSAGE_LIST/MENU_UNSET_SEEN"></a>
			</li>
			<li role="presentation" data-bind="click: listSetSeen, css: {'disabled': !messageList.hasCheckedOrSelected()}">
				<a href="#" tabindex="-1" data-icon="" data-i18n="MESSAGE_LIST/MENU_SET_SEEN"></a>
			</li>
			<li role="presentation" data-bind="click: listSetFlags, css: {'disabled': !messageList.hasCheckedOrSelected()}">
				<a href="#" tabindex="-1" data-icon="★" data-i18n="MESSAGE_LIST/MENU_SET_FLAG"></a>
			</li>
			<li role="presentation" data-bind="click: listUnsetFlags, css: {'disabled': !messageList.hasCheckedOrSelected()}">
				<a href="#" tabindex="-1" data-icon="☆" data-i18n="MESSAGE_LIST/MENU_UNSET_FLAG"></a>
			</li>
			<li role="presentation" data-bind="click: listSetAllSeen, css: {'disabled': !messageList().length}">
				<a href="#" tabindex="-1" data-icon="" data-i18n="MESSAGE_LIST/MENU_SET_ALL_SEEN"></a>
			</li>
			<li class="dividerbar" role="presentation" data-bind="command: forwardCommand">
				<a href="#" tabindex="-1" data-icon="↞" data-i18n="MESSAGE_LIST/BUTTON_MULTY_FORWARD"></a>
			</li>
			<li role="presentation" data-bind="command: downloadAttachCommand, visible: downloadAsZipAllowed">
				<a href="#" tabindex="-1" data-icon="📦" data-i18n="MESSAGE_LIST/DOWNLOAD_ALL_ATTACHMENTS"></a>
			</li>
			<li role="presentation" data-bind="command: downloadZipCommand, visible: downloadAsZipAllowed">
				<a href="#" tabindex="-1" data-icon="💾" data-i18n="MESSAGE/LINK_DOWNLOAD_AS_ZIP"></a>
			</li>
			<li class="dividerbar" role="presentation" data-bind="command: moveCommand">
				<a href="#" tabindex="-1" data-icon="📁" data-i18n="GLOBAL/MOVE_TO"></a>
			</li>
			<li class="presentation" role="presentation" data-bind="command: copyCommand">
				<a href="#" tabindex="-1" data-icon="&#xE068;" data-i18n="GLOBAL/COPY_TO"></a>
			</li>
			<li role="presentation" data-bind="visible: archiveAllowed, command: archiveCommand">
				<a href="#" tabindex="-1" data-icon="🗄" data-i18n="GLOBAL/TO_ARCHIVE">🗄</a>
			</li>
			<li role="presentation" data-bind="visible: canMarkAsSpam, command: spamCommand">
				<a href="#" tabindex="-1" data-icon="⚠" data-i18n="GLOBAL/SPAM"></a>
			</li>
			<li role="presentation" data-bind="visible: isSpamFolder, command: notSpamCommand">
				<a href="#" tabindex="-1" data-icon="" data-i18n="GLOBAL/NOT_SPAM"></a>
			</li>
			<li role="presentation" data-bind="command: deleteCommand">
				<a href="#" tabindex="-1" data-icon="🗑" data-i18n="GLOBAL/DELETE"></a>
			</li>
			<li role="presentation" data-bind="command: undeleteCommand, hidden: hideDeleted">
				<a href="#" tabindex="-1" data-icon="🗑" data-i18n="GLOBAL/UNDELETE" class="rotate"></a>
			</li>
			<li role="presentation" data-bind="visible: allowDangerousActions, command: deleteWithoutMoveCommand">
				<a href="#" tabindex="-1" data-icon="🗑" data-i18n="MESSAGE_LIST/BUTTON_DELETE_WITHOUT_MOVE"></a>
			</li>
			<li role="presentation" data-bind="visible: allowDangerousActions, click: clear">
				<a href="#" tabindex="-1" data-icon="🔥" data-i18n="MESSAGE_LIST/BUTTON_EMPTY_FOLDER"></a>
			</li>
		</menu>
	</div>
	<div class="btn-group dropdown onCheckedHide" data-bind="visible: !sortSupported()">
		<div id="no-sort-list" class="btn fontastic" data-i18n="[title]MESSAGE_LIST/NO_SORT">✖⬇</div>
	</div>
	<div class="btn-group dropdown onCheckedHide" data-bind="visible: sortSupported(), registerBootstrapDropdown: true">
		<a id="sort-list-dropdown-id" class="btn dropdown-toggle fontastic" href="#" tabindex="-1" data-i18n="[title]MESSAGE_LIST/SORT" data-bind="text: sortText">⬇</a>
		<menu class="dropdown-menu" role="menu" aria-labelledby="sort-list-dropdown-id">
			<li role="presentation" data-sort="" data-bind="click: changeSort">
				<a href="#" tabindex="-1" data-icon="📅⬇" data-i18n="MESSAGE_LIST/SORT_DATE_DESC"></a>
			</li>
			<li role="presentation" data-sort="DATE" data-bind="click: changeSort">
				<a href="#" tabindex="-1" data-icon="📅⬆" data-i18n="MESSAGE_LIST/SORT_DATE_ASC"></a>
			</li>
			<li class="dividerbar" role="presentation" data-sort="FROM" data-bind="click: changeSort">
				<a href="#" tabindex="-1" data-icon="@⬇" data-i18n="MESSAGE_LIST/SORT_FROM_ASC"></a>
			</li>
			<li role="presentation" data-sort="REVERSE FROM" data-bind="click: changeSort">
				<a href="#" tabindex="-1" data-icon="@⬆" data-i18n="MESSAGE_LIST/SORT_FROM_DESC"></a>
			</li>
			<li class="dividerbar" role="presentation" data-sort="REVERSE SIZE" data-bind="click: changeSort">
				<a href="#" tabindex="-1" data-icon="✉⬇" data-i18n="MESSAGE_LIST/SORT_SIZE_DESC"></a>
			</li>
			<li role="presentation" data-sort="SIZE" data-bind="click: changeSort">
				<a href="#" tabindex="-1" data-icon="✉⬆" data-i18n="MESSAGE_LIST/SORT_SIZE_ASC"></a>
			</li>
			<li class="dividerbar" role="presentation" data-sort="SUBJECT" data-bind="click: changeSort">
				<a href="#" tabindex="-1" data-icon="𝐒⬇" data-i18n="MESSAGE_LIST/SORT_SUBJECT_ASC"></a>
			</li>
			<li role="presentation" data-sort="REVERSE SUBJECT" data-bind="click: changeSort">
				<a href="#" tabindex="-1" data-icon="𝐒⬆" data-i18n="MESSAGE_LIST/SORT_SUBJECT_DESC"></a>
			</li>
			<li class="dividerbar" role="presentation" data-sort="REVERSE ARRIVAL" data-bind="click: changeSort">
				<a href="#" tabindex="-1" data-icon="📨⬇" data-i18n="MESSAGE_LIST/SORT_ARRIVAL_DESC"></a>
			</li>
			<li role="presentation" data-sort="ARRIVAL" data-bind="click: changeSort">
				<a href="#" tabindex="-1" data-icon="📨⬆" data-i18n="MESSAGE_LIST/SORT_ARRIVAL_ASC"></a>
			</li>
		</menu>
	</div>
</div>

<div class="messageList g-ui-user-select-none" data-bind="css: {'hideMessageListCheckbox': !useCheckboxesInList(), 'quokka-unified-on': unifiedView }">
	<!-- Quokka: the heading of the list -->
	<!-- Quokka: what is selected, and what to do with it (shown while something is selected) -->
	<div class="quokka-selbar" data-bind="visible: checkedCount">
		<a class="quokka-sel-close" href="#" data-bind="click: () => checkAll(false)" data-i18n="[title]QUOKKA/CLEAR_SELECTION"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
		<span class="quokka-sel-count" data-bind="text: checkedText"></span>
		<a class="quokka-sel-all" href="#" data-bind="click: () => checkAll(true), visible: isIncompleteChecked" data-i18n="QUOKKA/SELECT_ALL"></a>
		<span class="quokka-sel-actions">
			<a href="#" data-i18n="[title]QUOKKA/MARK_READ" data-bind="click: listSetSeen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"></path></svg><span data-i18n="QUOKKA/READ"></span></a>
			<a href="#" data-i18n="[title]QUOKKA/MOVE" data-bind="command: moveCommand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span data-i18n="QUOKKA/MOVE"></span></a>
			<a href="#" data-i18n="[title]QUOKKA/ARCHIVE" data-bind="command: archiveCommand"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1"></rect><path d="M5 8v11h14V8M10 12h4"></path></svg><span data-i18n="QUOKKA/ARCHIVE"></span></a>
			<a href="#" class="danger" data-i18n="[title]QUOKKA/DELETE" data-bind="command: deleteCommand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"></path></svg><span data-i18n="QUOKKA/DELETE"></span></a>
		</span>
	</div>
	<div class="quokka-head">
		<a class="quokka-menu toggleLeft" href="#" data-i18n="[title]QUOKKA/FOLDERS_AND_CATEGORIES"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></a>
		<div class="quokka-titles">
			<h1 class="quokka-title" data-bind="text: listTitle"></h1>
			<!-- Quokka: which mailbox (only with more than one); on the phone a tap opens the column to choose -->
			<a class="quokka-mailbox toggleLeft" href="#" data-bind="visible: mailboxTitle, text: mailboxTitle"></a>
		</div>
		<span class="quokka-unread" data-bind="text: listUnread"></span>
	</div>
	<div class="second-toolbar thm-message-list-top-toolbar">
		<i class="checkboxCheckAll fontastic" data-bind="text: checkAll() ? (isIncompleteChecked() ? '▣' : '☑') : '☐'"></i>
		<div class="search-input-wrp">
			<input type="search" class="inputSearch" tabindex="-1" placeholder="Search" autocorrect="off" autocapitalize="off" data-i18n="[placeholder]GLOBAL/SEARCH" data-bind="textInput: inputSearch, hasfocus: focusSearch">
			<a class="closeSearch" data-bind="click: cancelSearch, visible: messageListSearchDesc()">×</a>
		</div>
		<a class="btn buttonMoreSearch" data-bind="click: advancedSearchClick">▼</a>
	</div>
	<!-- Quokka: quick filters (on the phone also the categories) -->
	<nav class="quokka-filters" data-bind="foreach: quickFilters">
		<a data-bind="attr: {href: href, 'data-category': key || null}, css: {selected: selected, 'phone-only': phoneOnly}">
			<span class="dot"></span><!-- ko text: label --><!-- /ko -->
		</a>
	</nav>
	<div class="b-content">
		<div class="listThreadUidDesc" data-bind="visible: messageList.threadUid(), click: cancelThreadUid"
			data-icon="⬅" data-i18n="MESSAGE_LIST/BACK_TO_MESSAGE_LIST"></div>
		<div class="listSearchDesc" data-bind="visible: messageListSearchDesc(), text: messageListSearchDesc"></div>
		<div class="listDragOver" data-bind="css: {'viewAppendArea': dragOver() && !messageList.error() && !popupVisibility(), 'dragOverEnter': dragOverEnter }"
			data-icon="⬇" data-i18n="MESSAGE_LIST/PUT_MESSAGE_HERE"></div>
		<div class="listClear" data-bind="visible: clearListIsVisible()">
			<a href="#" class="g-ui-link" data-i18n="MESSAGE_LIST/BUTTON_EMPTY_FOLDER" data-bind="click: clear"></a>
		</div>
		<div class="listError error" data-bind="visible: !dragOver() && messageList.error(), text: messageList.error"></div>
		<div class="listEmptyMessage" data-bind="visible: listEmptyMessage(), text: listEmptyMessage()"></div>
		<div class="listLoading" data-bind="visible: !dragOver() && !messageList().length &&
			messageList.isLoading() && !messageList.error()">
			<i class="icon-spinner"></i>
			<span data-i18n="GLOBAL/LOADING"></span>
		</div>

		<!-- ko if: listGrouped -->
		<div class="messageListPlace" data-bind="dragmessages: 1, i18nUpdate: groupedList, foreach: groupedList" draggable="true">
			<div class="groupLabel" data-bind="text: label, click: $root.groupSearch" data-i18n="[title]GLOBAL/SEARCH"></div>
			<!-- ko foreach: messages -->
			<div class="messageListItem" data-bind="css: lineAsCss(), attr: {title: preview}">
				<div class="messageCheckbox">
					<div class="checkboxMessage fontastic" data-bind="text: checked() ? '☑' : '☐'"></div>
				</div><div>
					<div class="flagParent fontastic"></div>
					<div class="senderParent" data-bind="attr: {title: senderClearEmailsString}, text: senderEmailsString"></div>
					<div class="subjectParent" data-bind="text: subject"></div>
					<div class="previewParent" data-bind="text: preview"></div>
					<div class="categoryParent" data-bind="visible: categoryKey, text: categoryLabel, attr: {'data-category': categoryKey}"></div>
					<div class="threads-len" data-bind="visible: 1 < threadsLen(), text: threadsLenText(), attr: {'data-unseen': threadUnseenLen() || null}"></div>
					<div class="attachmentParent">
						<i data-bind="css: attachmentIconClass"></i>
					</div>
					<div class="sizeParent" data-bind="text: friendlySize()"></div>
					<time data-bind="attr:{'data-time-format':$root.timeFormat()}, time: dateTimestamp"></time>
				</div>
			</div>
			<!-- /ko -->
		</div>
		<!-- /ko -->
		<!-- ko ifnot: listGrouped -->
		<div class="messageListPlace" data-bind="dragmessages: 1, foreach: messageList" draggable="true">
			<div class="messageListItem" data-bind="css: lineAsCss(), attr:{title:preview}">
				<div class="messageCheckbox">
					<div class="checkboxMessage fontastic" data-bind="text: checked() ? '☑' : '☐'"></div>
				</div><div data-bind="attr:{style:indent()}, css:{reply:indent()}">
					<div class="flagParent fontastic"></div>
					<div class="senderParent" data-bind="attr: {title: senderClearEmailsString}, text: senderEmailsString"></div>
					<div class="subjectParent" data-bind="text: subject"></div>
					<div class="previewParent" data-bind="text: preview"></div>
					<div class="categoryParent" data-bind="visible: categoryKey, text: categoryLabel, attr: {'data-category': categoryKey}"></div>
					<div class="threads-len" data-bind="visible: 1 < threadsLen(), text: threadsLenText(), attr: {'data-unseen': threadUnseenLen() || null}"></div>
					<div class="attachmentParent">
						<i data-bind="css: attachmentIconClass"></i>
					</div>
					<div class="sizeParent" data-bind="text: friendlySize()"></div>
					<time data-time-format="AUTO" data-bind="time: dateTimestamp"></time>
				</div>
			</div>
		</div>
		<!-- /ko -->

		<div id="messagesDragImage"><span class="text"></span>&nbsp;<span class="fontastic">✉</span></div>
	</div>
	<!-- Quokka: "All mailboxes": the emails of every mailbox, each with its mailbox (Common/Mailboxes.js) -->
	<!-- ko if: unifiedView -->
	<div class="quokka-unified">
		<div class="listError error" data-bind="visible: !unifiedAvailable(), text: unifiedTexts.off"></div>
		<div class="quokka-unified-pending" data-bind="visible: unifiedPendingText, text: unifiedPendingText"></div>
		<div class="listEmptyMessage" data-bind="visible: unifiedEmpty, text: unifiedTexts.empty"></div>
		<div class="listLoading" data-bind="visible: unifiedLoading() && !unifiedMessages().length">
			<i class="icon-spinner"></i>
			<span data-bind="text: unifiedTexts.loading"></span>
		</div>
		<div class="messageListPlace" data-bind="foreach: unifiedMessages">
			<div class="messageListItem quokka-urow" data-bind="css: lineCss, click: $root.openUnified, attr: {title: preview}">
				<div class="messageCheckbox">
					<span class="quokka-uavatar" aria-hidden="true" data-bind="text: initial"></span>
					<img class="quokka-upic" loading="lazy" alt="" data-bind="visible: avatar, attr: {src: avatar || null}, event: {error: $root.unifiedNoPic}">
				</div><div>
					<div class="flagParent fontastic" data-bind="click: $root.unifiedStar"></div>
					<div class="senderParent" data-bind="text: sender, attr: {title: address}"></div>
					<div class="subjectParent" data-bind="text: subject"></div>
					<div class="previewParent" data-bind="text: preview"></div>
					<div class="quokka-chips">
						<span class="quokka-boxtag"><span class="box-badge" aria-hidden="true" data-bind="text: box.letter, attr: {style: boxStyle}"></span><!-- ko text: box.name --><!-- /ko --></span>
						<span class="categoryParent" data-bind="visible: categoryLabel, text: categoryLabel, attr: {'data-category': category}"></span>
					</div>
					<div class="attachmentParent"><i data-bind="css: attachment ? 'icon-attachment' : ''"></i></div>
					<time data-time-format="AUTO" data-bind="time: at"></time>
					<span class="quokka-uactions">
						<a href="#" data-bind="click: $root.unifiedRead, attr: {title: readTitle}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"></path></svg></a>
						<a href="#" data-bind="visible: canArchive, click: $root.unifiedArchive, attr: {title: $root.unifiedTexts.archive}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1"></rect><path d="M5 8v11h14V8M10 12h4"></path></svg></a>
						<a href="#" class="danger" data-bind="visible: canTrash, click: $root.unifiedTrash, attr: {title: $root.unifiedTexts.trash}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"></path></svg></a>
					</span>
				</div>
			</div>
		</div>
		<div class="quokka-unified-more" data-bind="visible: unifiedMore">
			<a href="#" class="btn" data-bind="click: unifiedMoreClick, text: unifiedTexts.more"></a>
		</div>
	</div>
	<!-- /ko -->
	<div class="b-footer thm-message-list-bottom-toolbar">
		<!-- ko if: userUsageProc() -->
		<span data-bind="attr: { title: quotaTooltip() }" class="e-quota">
			<!-- ko text: userUsageProc --><!-- /ko -->%
		</span>
		<!-- /ko -->
		<!-- ko template: { name: 'Paginator', data: messageListPaginator } --><!-- /ko -->
	</div>
</div>
