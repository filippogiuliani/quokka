<header>
	<a href="#" class="close" data-bind="click: close">×</a>
	<h3 data-i18n="POPUPS_SYSTEM_FOLDERS/TITLE_SYSTEM_FOLDERS"></h3>
</header>
<div class="modal-body">
	<!-- Quokka: one row per role, with what goes there -->
	<div class="alert" data-bind="visible: '' !== notification(), text: notification"></div>
	<p class="quokka-sys-intro" data-i18n="QUOKKA/SYS_INTRO"></p>
	<div class="quokka-sysrows">
		<div class="quokka-sysrow">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4z"></path><path d="M22 2 11 13"></path></svg>
			<label><b data-i18n="FOLDER_LIST/SENT_NAME"></b><small data-i18n="QUOKKA/SYS_SENT_HINT"></small></label>
			<select data-bind="options: folderSelectList, value: sentFolder,
				optionsText: 'name', optionsValue: 'id', optionsAfterRender: $root.defaultOptionsAfterRender"></select>
		</div>
		<div class="quokka-sysrow">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
			<label><b data-i18n="FOLDER_LIST/DRAFTS_NAME"></b><small data-i18n="QUOKKA/SYS_DRAFTS_HINT"></small></label>
			<select data-bind="options: folderSelectList, value: draftsFolder,
				optionsText: 'name', optionsValue: 'id', optionsAfterRender: $root.defaultOptionsAfterRender"></select>
		</div>
		<div class="quokka-sysrow">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></svg>
			<label><b data-i18n="FOLDER_LIST/SPAM_NAME"></b><small data-i18n="QUOKKA/SYS_SPAM_HINT"></small></label>
			<select data-bind="options: folderSelectList, value: spamFolder,
				optionsText: 'name', optionsValue: 'id', optionsAfterRender: $root.defaultOptionsAfterRender"></select>
		</div>
		<div class="quokka-sysrow">
			<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path></svg>
			<label><b data-i18n="FOLDER_LIST/TRASH_NAME"></b><small data-i18n="QUOKKA/SYS_TRASH_HINT"></small></label>
			<select data-bind="options: folderSelectList, value: trashFolder,
				optionsText: 'name', optionsValue: 'id', optionsAfterRender: $root.defaultOptionsAfterRender"></select>
		</div>
		<div class="quokka-sysrow">
			<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1"></rect><path d="M5 8v11h14V8"></path><path d="M10 12h4"></path></svg>
			<label><b data-i18n="FOLDER_LIST/ARCHIVE_NAME"></b><small data-i18n="QUOKKA/SYS_ARCHIVE_HINT"></small></label>
			<select data-bind="options: folderSelectList, value: archiveFolder,
				optionsText: 'name', optionsValue: 'id', optionsAfterRender: $root.defaultOptionsAfterRender"></select>
		</div>
	</div>
</div>
