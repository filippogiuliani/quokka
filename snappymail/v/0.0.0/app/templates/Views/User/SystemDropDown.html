<div class="btn-toolbar g-ui-user-select-none">
	<div class="audioPlace"
			data-bind="visible: '' !== currentAudio(), attr: { title: currentAudio }, click: stopPlay">
		<div class="playIcon"><div></div></div>
		<i class="stopIcon fontastic">⏸</i>
	</div>
	<div class="btn-group dropdown" data-bind="registerBootstrapDropdown: true, initDom: accountMenu">
		<a id="top-system-dropdown-id" href="#" tabindex="-1" class="btn single btn-block dropdown-toggle">
			<span class="accountPlace hide-mobile" data-bind="text: accountName(), attr:{ title: accountEmail }"></span>
			<i class="fontastic" data-bind="css: {'icon-spinner': accountsLoading()}">👤</i>
<!--
			<b data-bind="text: accountsUnreadCount, visible: 100 > accountsUnreadCount() && accountsUnreadCount()"></b>
			<b data-bind="visible: 99 < accountsUnreadCount()">99+</b>
			&nbsp;
-->
		</a>
		<menu class="dropdown-menu right-edge" tabindex="-1" role="menu" aria-labelledby="top-system-dropdown-id">

			<!-- ko foreach: accounts -->
			<li role="presentation">
				<a class="email-title" href="#" data-bind="click: $root.accountClick, text: label(),
					attr: {title: email, 'data-unread': unreadEmails, 'data-icon': $root.accountEmail() === email ? '✔' : '👤'}"></a>
			</li>
			<!-- /ko -->

			<li class="dividerbar" role="presentation" data-bind="visible: allowAccounts">
				<a href="#" tabindex="-1" data-bind="click: addAccountClick" data-icon="✚" data-i18n="TOP_TOOLBAR/BUTTON_ADD_ACCOUNT"></a>
			</li>
			<li role="presentation" data-bind="visible: allowContacts">
				<a href="#" tabindex="-1" data-bind="click: contactsClick" data-icon="📇" data-i18n="GLOBAL/CONTACTS"></a>
			</li>
			<li role="presentation">
				<a href="#" tabindex="-1" data-bind="click: settingsClick" data-icon="⚙" data-i18n="TITLES/SETTINGS"></a>
			</li>
			<li role="presentation">
				<a href="#" tabindex="-1" data-bind="click: settingsHelp" data-icon="🛈" data-i18n="GLOBAL/HELP"></a>
			</li>
			<!-- ko if: hasColorSchemeMode -->
			<li class="dividerbar color-scheme-toggle" role="presentation">
				<div>
					<button type="button" tabindex="-1" data-bind="click: lightModeClick, css: { active: 'light' === colorSchemeMode() }, attr: { title: 'Light mode', 'aria-pressed': 'light' === colorSchemeMode() }" aria-label="Light mode">☀</button>
					<button type="button" tabindex="-1" data-bind="click: systemModeClick, css: { active: '' === colorSchemeMode() }, attr: { title: 'System mode', 'aria-pressed': '' === colorSchemeMode() }" aria-label="System mode">🖥</button>
					<button type="button" tabindex="-1" data-bind="click: darkModeClick, css: { active: 'dark' === colorSchemeMode() }, attr: { title: 'Dark mode', 'aria-pressed': 'dark' === colorSchemeMode() }" aria-label="Dark mode">🌒</button>
				</div>
			</li>
			<!-- /ko -->
			<li class="dividerbar" role="presentation">
				<a href="#" tabindex="-1" data-bind="click: logoutClick" data-icon="⏻" data-i18n="GLOBAL/LOGOUT"></a>
			</li>
		</menu>
	</div>
</div>
	<!-- Quokka: the phone's bottom menu, on every screen -->
	<nav class="quokka-tabbar">
		<a class="tab-mail" data-bind="attr: {href: inboxHref}, click: tabClick"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg><span data-i18n="QUOKKA/TAB_MAIL"></span></a>
		<a class="tab-categories" href="#" data-bind="click: categoriesClick"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg><span data-i18n="QUOKKA/TAB_CATEGORIES"></span></a>
		<a class="tab-archive" data-bind="attr: {href: archiveHref}, visible: archiveHref, click: tabClick"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="5" rx="1"></rect><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4"></path></svg><span data-i18n="QUOKKA/TAB_ARCHIVE"></span></a>

	</nav>
