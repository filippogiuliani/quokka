<div class="b-toolbar btn-toolbar">
	<a class="btn btn-thin fontastic toggleLeft" data-bind="click: toggleLeftPanel"></a>
	<a class="btn" data-bind="click: backToInbox" data-icon="⬅" data-i18n="GLOBAL/BACK"></a>
</div>
<!-- Quokka: the app's name, the way back to the mail, the pages, who is signed in -->
<div class="quokka-brand"><span class="quokka-wordmark" role="img" aria-label="Quokka"><svg viewBox="0 0 300 320" aria-hidden="true"><circle class="qf-fur" cx="70" cy="62" r="44" stroke-width="26"></circle><circle class="qf-fur" cx="230" cy="62" r="44" stroke-width="26"></circle><ellipse class="qf-fur" cx="150" cy="180" rx="122" ry="118" stroke-width="30"></ellipse><circle cx="108" cy="166" r="15" fill="#1e3a5f"></circle><circle cx="192" cy="166" r="15" fill="#1e3a5f"></circle><ellipse cx="150" cy="202" rx="20" ry="14" fill="#1e3a5f"></ellipse><path class="qf-smile" d="M120 232 Q150 258 180 232" stroke-width="16" stroke-linecap="round"></path></svg>quokka</span></div>
<a class="quokka-back" href="#" data-bind="click: backToInbox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span data-i18n="QUOKKA/BACK_TO_MAIL"></span></a>
<div class="quokka-settings-title" data-i18n="QUOKKA/SETTINGS"></div>
<nav data-bind="foreach: menu">
	<a data-bind="css: {'selected': selected }, attr: { 'href': $root.link(route), 'data-route': route, 'data-i18n': label }"></a>
</nav>
<div class="quokka-account quokka-account-static">
	<span class="quokka-avatar" data-bind="text: accountInitial"></span>
	<span class="quokka-account-email" data-bind="text: accountEmail"></span>
</div>
